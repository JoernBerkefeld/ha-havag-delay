# Mon-Fri checks at the three helper times, each for the first tram predicted at least 8 minutes later.
# Replace notify.mobile_app_YOUR_PHONE and notify.alexa_media_YOUR_ECHO with your real services
# (Developer Tools > Actions, search "notify."). Needs HA 2024.10+.

alias: HAVAG Linie 10 Verspätung
description: Mon-Fri delay check for the first tram predicted at least 8 minutes after the check time
mode: single
triggers:
  - trigger: time
    at: input_datetime.havag_check_1
  - trigger: time
    at: input_datetime.havag_check_2
  - trigger: time
    at: input_datetime.havag_check_3
conditions:
  - condition: time
    weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
actions:
  # Always returns a result (status "error" with a message if the service is unreachable),
  # so the notifications below go out either way.
  - action: havag_delay.get_departure
    data:
      offset_minutes: 8
    response_variable: havag
  - action: notify.mobile_app_YOUR_PHONE
    data:
      title: Straßenbahn Linie 10
      message: "{{ havag.text }}"
  - action: notify.alexa_media_YOUR_ECHO
    data:
      message: "{{ havag.text }}"
      data:
        type: announce
