# Door-open notifications with the next departure. Needs HA 2024.10+.
# Replace:
#   binary_sensor.YOUR_DOOR_SENSOR      the door contact sensor ("on" = open)
#   notify.mobile_app_YOUR_PHONE        your phone
#   notify.mobile_app_WIFES_PHONE       your wife's phone
#
# 09:15-10:15 -> your phone, 14:30-15:30 -> your wife's phone.
# Not restricted to weekdays. To limit it, add a weekday time condition like in
# automation-morning.yaml.
# Cooldown: at most one notification per 10 minutes. Change 600 (seconds) or remove it.
# The time windows are conditions on purpose: a door opened outside them does not start the cooldown.

alias: HAVAG Tür geöffnet – nächste Linie 10
description: Sends the next departure when the door opens in the morning or afternoon window
mode: single
triggers:
  - trigger: state
    entity_id: binary_sensor.YOUR_DOOR_SENSOR
    to: "on"
conditions:
  - condition: or
    conditions:
      - condition: time
        after: "09:15:00"
        before: "10:15:00"
      - condition: time
        after: "14:30:00"
        before: "15:30:00"
  - condition: template
    value_template: >-
      {{ this.attributes.last_triggered is none
         or (now() - this.attributes.last_triggered).total_seconds() > 600 }}
actions:
  # No offset: the next departure from now on, with its delay and minutes until it leaves.
  - action: havag_delay.get_departure
    response_variable: havag
  - action: >-
      {{ 'notify.mobile_app_YOUR_PHONE' if now().hour < 12
         else 'notify.mobile_app_WIFES_PHONE' }}
    data:
      title: Straßenbahn Linie 10
      message: "{{ havag.text }}"
